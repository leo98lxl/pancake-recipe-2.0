<!DOCTYPE html>
<html lang="sv">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enkelt pannkaksrecept - Recept</title>

    <link href="styles.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet"> <!--Google Fonts Font "Ubuntu"-->
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=skillet" /> <!--Google Fonts Logo "Skillet"-->
</head>

<body>
    <section class="recipe">
        <nav class="header__navigation">
                <a class="header__top--logo" href="./index.html"><span class="material-symbols-outlined">skillet</span></a>
                <ul class="header__list">
                    <li><a class="header__list--item" href="./recipes.html">RECEPT</a></li>
                    <li><a class="header__list--item" href="./index.html">OM OSS</a></li>
                    <li><a class="header__list--item" href="./form.html">KONTAKT</a></li>
                </ul>
                <button class="header__top--button" href="./index.html">Logga in</button>
            </nav>

            <main class="form">
                <h1 class="form__header">Skicka in ditt recept till oss!</h1>
                <p class="recipe__description">Vi tar jättegärna emot dina recept. Fyll i formuläret så bidrar du till vår redan gedigna samling!</p>

                <form action="#" method="post">
                    
                    <section class="form__area">
                        <label for="surname">Förnamn</label>
                        <input type="text" id="surname" name="surname" placeholder="Ditt förnamn" required/>
                    </section>

                    <section class="form__area">
                        <label for="lastname">Efternamn</label>
                        <input type="text" id="lastname" name="lastname" placeholder="Ditt efternamn" required/>
                    </section>

                    <section class="form__area">
                        <label for="email">E-post</label>
                        <input type="email" id="email" name="email" placeholder="namn@exempel.se" required/>
                    </section>

                    <section class="form__area">
                        <label for="password">Skapa ett lösenord (minst 8 tecken)</label>
                        <input type="password" id="password" name="password" placeholder="xxxxxxxx" minlength="8" required/>
                    </section>

                    <section class="form__area">
                        <label for="phone">Telefon</label>
                        <input type="tel" id="phone" name="phone" placeholder="ex. 07x-xxx-xxx" required/>
                    </section>

                    <section class="form__area">
                        <label for="attachment">Ladda upp</label>
                        <input type="file" id="attachment" name="attachment" required/>
                    </section>

                    <section class="form__area">
                        <label for="message">Beskriv ditt recept med några ord! (valfritt)</label>
                        <textarea id="message" name="message" rows="4" placeholder="Beskrivning"/></textarea>
                    </section>

                    <fieldset class="form__area--radio">
                        <legend>Hur ska vi kontakta dig&quest;</legend>
                        <label><input type="radio" name="contact-via" value="email">Via e-post</label>

                        <label><input type="radio" name="contact-via" value="phone">Via telefon</label>
                    </fieldset>

                    <section class="form__area">
                        <label>
                        <input type="checkbox" name="updates" required/>Ja, jag vill få e-postaviseringar om våra nya recept!
                    </section>

                    <button type="submit">Skicka in</button>
                </form>
            </main>
    </section>
</html>
